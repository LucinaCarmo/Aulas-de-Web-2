        <?php
        if ($_SERVER["REQUEST_METHOD"] == "POST") {
            $senha = $_POST['password'];

            if (verificarSenha($senha)) {
                echo '<p class="message success">Login bem-sucedido!</p>';
            } else {
                echo '<p class="message error">Senha inválida. A senha deve ter 6 ou 7 dígitos.</p>';
            }
        }

        function verificarSenha($senha) {
            // Verifica se a senha tem 6 ou 7 dígitos e se contém apenas números
            return preg_match('/^\d{6}$|^\d{7}$/', $senha);
        }
